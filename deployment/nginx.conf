# ==============================================================================
# HandoffIQ - Production Nginx Reverse Proxy Configuration
# Optimized for AWS EC2 Deployment with React Frontend + Spring Boot 3 Backend
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream timing and correlation ID
    log_format handoffiq_combined '$remote_addr - $remote_user [$time_local] '
                                  '"$request" $status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  'rt=$request_time uct="$upstream_connect_time" '
                                  'uht="$upstream_header_time" urt="$upstream_response_time" '
                                  'cid="$http_x_correlation_id"';

    access_log /var/log/nginx/access.log handoffiq_combined;

    # TCP & Buffer optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml+rss application/atom+xml image/svg+xml;

    # Upstream Spring Boot backend cluster (local or private subnet)
    upstream spring_boot_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP Server - Redirect all HTTP traffic to HTTPS in production
    server {
        listen 80;
        listen [::]:80;
        server_name handoffiq.yourdomain.com;

        # Health check endpoint for AWS ALB (Application Load Balancer)
        location /health {
            access_log off;
            return 200 'healthy\n';
        }

        # Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server - Production SSL & Reverse Proxy
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name handoffiq.yourdomain.com;

        # SSL Certificates (AWS ACM or Let's Encrypt Certbot)
        ssl_certificate /etc/letsencrypt/live/handoffiq.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/handoffiq.yourdomain.com/privkey.pem;

        # Hardened SSL Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com https://api.openai.com;" always;

        # Frontend Static Files (React + Vite Build)
        root /var/www/handoffiq/frontend/dist;
        index index.html;

        # API Reverse Proxy -> Spring Boot Backend
        location /api/ {
            proxy_pass http://spring_boot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # Forward or generate Correlation ID
            proxy_set_header X-Correlation-Id $http_x_correlation_id;

            # Extended timeouts for AI processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffering configuration
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
        }

        # Spring Boot Actuator Monitoring Endpoints
        location /actuator/ {
            proxy_pass http://spring_boot_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Restrict access to internal networks or VPN if desired
            # allow 10.0.0.0/16;
            # deny all;
        }

        # OpenAPI / Swagger UI Documentation
        location /swagger-ui/ {
            proxy_pass http://spring_boot_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            proxy_pass http://spring_boot_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }

        # React Router SPA Fallback (HTML5 History Mode)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
