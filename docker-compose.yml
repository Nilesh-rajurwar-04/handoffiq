# ==============================================================================
# HandoffIQ - Production Docker Compose Configuration
# Architecture: AWS EC2 (Docker Host) + Amazon RDS MySQL (Managed Database)
# ==============================================================================
# Services:
#   1. backend:  Spring Boot 3 (Java 21) executing business logic and Flyway migrations
#   2. frontend: React + Vite served via Nginx reverse proxying /api to backend
# Network:
#   handoffiq-network (isolated bridge network)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Service (Spring Boot 3 + Java 21)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: handoffiq-backend:latest
    container_name: handoffiq-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8085
      - SERVER_ADDRESS=0.0.0.0
      # Amazon RDS MySQL Database Connection
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_FLYWAY_ENABLED=${SPRING_FLYWAY_ENABLED:-true}
      # Security & JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      # AI Provider
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-15000}
      # CORS (allow wildcard or specific domains)
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      # Storage
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    # Only expose port 8085 inside the Docker network (NOT to the public internet)
    expose:
      - "8085"
    networks:
      - handoffiq-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8085/api/dashboard/stats || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Frontend Service (React + Vite + Production Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: handoffiq-frontend:latest
    container_name: handoffiq-frontend
    restart: unless-stopped
    ports:
      # Exposes port 80 on EC2 public IP
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - handoffiq-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# ------------------------------------------------------------------------------
# Isolated Bridge Network for Inter-Container Communication
# ------------------------------------------------------------------------------
networks:
  handoffiq-network:
    name: handoffiq-network
    driver: bridge
