# ==============================================================================
# HandoffIQ - Production Profile Configuration (AWS EC2 + Amazon RDS MySQL)
# Active Profile: prod
# ==============================================================================

server.port=${PORT:8085}
server.address=0.0.0.0

# ==============================================================================
# Amazon RDS MySQL 8 Database Configuration
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Production HikariCP Connection Pool
spring.datasource.hikari.pool-name=HandoffIqHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations (Auto-migrates RDS on startup)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Actuator Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Security & JWT
handoffiq.jwt.secret=${JWT_SECRET}
handoffiq.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Nginx handles proxying; wildcard allowed for flexibility)
handoffiq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# AI Configuration
handoffiq.ai.provider=${AI_PROVIDER:gemini}
handoffiq.ai.gemini.api-key=${GEMINI_API_KEY:}
handoffiq.ai.openai.api-key=${OPENAI_API_KEY:}
handoffiq.ai.timeout-ms=${AI_TIMEOUT_MS:15000}

# Storage Configuration (Cloudinary Cloud Storage Provider)
handoffiq.storage.type=${STORAGE_TYPE:cloudinary}
handoffiq.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
handoffiq.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
handoffiq.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
handoffiq.storage.local.upload-dir=${UPLOAD_DIR:./uploads/documents}
