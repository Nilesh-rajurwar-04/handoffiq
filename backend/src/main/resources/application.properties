# ==============================================================================
# HandoffIQ Application Configuration
# ==============================================================================
spring.application.name=handoffiq-backend
server.port=8085

# Servlet & Multipart settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================================================================
# MySQL Database Configuration (Local MySQL / MariaDB Server on Port 3306)
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/handoffiq?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root@123
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson JSON Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Flyway Database Migrations (Disabled when pre-seeded in MySQL / Workbench)
spring.flyway.enabled=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# JWT Security Configuration
handoffiq.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
handoffiq.jwt.expiration-ms=86400000

# AI Provider Configuration
# Supported providers: gemini | openai | fallback
handoffiq.ai.provider=${AI_PROVIDER:gemini}
handoffiq.ai.gemini.api-key=${GEMINI_API_KEY:}
handoffiq.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
handoffiq.ai.openai.api-key=${OPENAI_API_KEY:}
handoffiq.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
handoffiq.ai.timeout-ms=15000

# File Storage Configuration
# Supported types: local | s3
handoffiq.storage.type=${STORAGE_TYPE:local}
handoffiq.storage.local.upload-dir=./uploads/documents
handoffiq.storage.s3.bucket=${AWS_S3_BUCKET:handoffiq-documents}
handoffiq.storage.s3.region=${AWS_REGION:us-east-1}

# CORS Configuration
handoffiq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
