# ==============================================================================
# HandoffIQ Application Configuration
# ==============================================================================
spring.application.name=handoffiq-backend
server.port=${PORT:8085}
server.address=0.0.0.0

# Servlet & Multipart settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================================================================
# MySQL Database Configuration (Local MySQL / Cloud Managed MySQL)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/handoffiq?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root@123}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Jackson JSON Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Flyway Database Migrations (Automated schema migration & realistic seed on cloud)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# JWT Security Configuration
handoffiq.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
handoffiq.jwt.expiration-ms=86400000

# AI Provider Configuration
# Supported providers: gemini | openai | fallback
handoffiq.ai.provider=${AI_PROVIDER:gemini}
handoffiq.ai.gemini.api-key=${GEMINI_API_KEY:}
handoffiq.ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
handoffiq.ai.openai.api-key=${OPENAI_API_KEY:}
handoffiq.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
handoffiq.ai.timeout-ms=15000

# File Storage Configuration (Cloudinary Cloud Storage & Local Fallback)
# Supported types: cloudinary | local
handoffiq.storage.type=${STORAGE_TYPE:cloudinary}
handoffiq.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
handoffiq.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
handoffiq.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
handoffiq.storage.local.upload-dir=${UPLOAD_DIR:./uploads/documents}

# CORS Configuration
handoffiq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,*}
